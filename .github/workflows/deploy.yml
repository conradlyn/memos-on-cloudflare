name: Deploy to Cloudflare Workers

# 推送即部署由 Cloudflare Workers Builds 负责（见 README「Git 自动部署」）。
# 这个 workflow 仅保留为备份通道，手动触发。
# 之所以不再跟随 push：它需要一个带 D1:Edit 权限的 CLOUDFLARE_API_TOKEN，
# 否则「Apply D1 migrations」必然失败，每次推送都会在提交上挂一个红叉。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: cd web && npm install

      - name: Build frontend
        run: npm run build:web

      - name: Resolve repository version
        id: repository_version
        run: node scripts/fetch-github-version.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_VERSION_OWNER: jkjoy
          GITHUB_VERSION_REPO: memos-on-cloudflare

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cfmemos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy --keep-vars --var "APP_VERSION:${{ steps.repository_version.outputs.version }}" --var "MEMOS_COMPAT_VERSION:0.28.0"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
